namespace: nimbus

frontend:
  name: nimbus-frontend
  image:
    repository: nimbus-frontend
    tag: phase4-fix1
  replicas: 1
  containerPort: 3000
  servicePort: 3000
  env:
    # Frontend always calls backend through ingress (same origin)
    NEXT_PUBLIC_API_BASE_URL: "/api"
    NEXT_PUBLIC_API_URL: "/api"
    NEXT_PUBLIC_BACKEND_URL: "/api"

backend:
  name: nimbus-backend
  image:
    repository: ghcr.io/Shoaibstat876/nimbus-backend
    tag: phase5
  replicas: 1
  containerPort: 8000
  servicePort: 8000

  # Step 8: enable Dapr sidecar
  dapr:
    enabled: true
    appId: nimbus-backend
    appPort: 8000

  env:
    JWT_ALGORITHM: "HS256"
    ACCESS_TOKEN_EXPIRE_MINUTES: "1440"

    # CSV is safest (works with split(",") style parsers)
    CORS_ORIGINS: "http://nimbus.local,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001"

    # Used by auth flows / redirects (keep stable for ingress)
    AUTH_SERVER_URL: "http://nimbus.local"

# Step 8: add worker image configuration
worker:
  name: nimbus-worker
  image:
    repository: ghcr.io/Shoaibstat876/nimbus-worker
    tag: phase5
  replicas: 1
  containerPort: 8001
  servicePort: 8001

  # Step 8: enable Dapr sidecar for worker
  dapr:
    enabled: true
    appId: nimbus-worker
    appPort: 8001

  env:
    PORT: "8001"

ingress:
  enabled: true
  host: nimbus.local
